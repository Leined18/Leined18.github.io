<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Skills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="../static/css/styles.css" rel="stylesheet">
    <link href="../static/css/pages/portfolio.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Devicon -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
</head>

<body>

    <header class="header-banner">
        <h1>💡 Skills</h1>
        <p>Matriz de habilidades técnicas y herramientas de trabajo diarias</p>
    </header>

    <div data-partial="./header.html" data-role="navigation"></div>

    <main class="container-primary">

        <section class="section-card skills-section">

            <div class="skills-grid">

                <div class="skill-item">
                    <i class="fab fa-html5" style="color:#e34c26"></i>
                    <span>HTML5</span>
                </div>

                <div class="skill-item">
                    <i class="fab fa-css3-alt" style="color:#1572b6"></i>
                    <span>CSS3</span>
                </div>

                <div class="skill-item">
                    <i class="devicon-c-plain colored"></i>
                    <span>C</span>
                </div>

                <div class="skill-item">
                    <i class="devicon-cplusplus-plain colored"></i>
                    <span>C++</span>
                </div>

                <div class="skill-item">
                    <i class="fab fa-js-square" style="color:#f7df1e"></i>
                    <span>JavaScript</span>
                </div>

                <div class="skill-item">
                    <i class="fab fa-python" style="color:#3776ab"></i>
                    <span>Python</span>
                </div>

                <div class="skill-item">
                    <i class="devicon-java-original colored"></i>
                    <span>Java</span>
                </div>

                <div class="skill-item">
                    <i class="devicon-docker-plain colored"></i>
                    <span>Docker</span>
                </div>

                <div class="skill-item">
                    <i class="fas fa-cubes" style="color:#8e44ad"></i>
                    <span>SOLID</span>
                </div>

                <div class="skill-item">
                    <i class="fas fa-brain" style="color:#00bcd4"></i>
                    <span>AI</span>
                </div>

                <div class="skill-item">
                    <i class="fas fa-bullseye" style="color:#e67e22"></i>
                    <span>Hyperfocus</span>
                </div>

                <div class="skill-item">
                    <i class="fab fa-git-alt" style="color:#f05032"></i>
                    <span>Git &amp; GitHub</span>
                </div>

            </div>

        </section>

    </main>

    <div data-partial="./footer.html"
         data-role="footer"
         data-footer-text="&copy; 2025 Danpalac. Roadmap de habilidades en constante actualización.">
    </div>

    <script src="../static/js/layout.js"></script>
    <script src="../static/js/header.js"></script>

</body>
</html>
